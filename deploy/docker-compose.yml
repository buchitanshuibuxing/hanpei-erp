services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-erp}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?请在 .env 中设置 PG_PASSWORD}
      POSTGRES_DB: ${PG_DB:-erp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-erp} -d ${PG_DB:-erp}"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data

  # 对象存储占位：业务代码未使用（附件落 data/uploads/），默认不启动。
  # 国内镜像加速源对 minio/* 返回 denied，按需启用时请自行配置可达 registry：
  #   docker compose --profile storage up -d
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    profiles: ["storage"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-erp}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?请在 .env 中设置 MINIO_PASSWORD}
    volumes:
      - miniodata:/data

  erp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PIP_INDEX: ${PIP_INDEX:-https://pypi.org/simple}
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${PG_USER:-erp}:${PG_PASSWORD}@postgres:5432/${PG_DB:-erp}
      SERVE_FRONTEND: "1"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - appdata:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8008/api/health',timeout=3)"]
      interval: 15s
      retries: 10
      start_period: 30s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - erp

volumes:
  pgdata:
  redisdata:
  miniodata:
  appdata:
